<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Safety Watch AI — Mobile Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        #map { height: 400px; border-radius: 1rem; z-index: 1; width: 100%; touch-action: pan-x pan-y; }
        .sidebar-card { background: #1f2937; border: 1px solid #374151; max-height: 500px; overflow-y: auto; }
        /* Custom scrollbar for the directory */
        .sidebar-card::-webkit-scrollbar { width: 4px; }
        .sidebar-card::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-white p-3 md:p-6">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-2xl font-black text-blue-500 tracking-tighter">SAFETY WATCH AI</h1>
            <div class="flex gap-2 w-full md:w-auto">
                <input id="locInput" class="flex-1 p-3 rounded-lg bg-gray-800 border border-gray-700 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Search area (e.g. Naini)">
                <button onclick="checkArea()" class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-lg font-bold text-sm transition shadow-lg">Check</button>
            </div>
            <button onclick="firebase.auth().signOut()" class="text-xs text-gray-500 hover:text-white underline">Logout</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 space-y-4">
                <div id="map" class="shadow-2xl border border-gray-700"></div>
                
                <div id="statusBox" class="hidden p-4 bg-gray-800 rounded-xl border-l-4 border-blue-500 shadow-xl transition-all">
                    <div class="flex items-center gap-2 mb-2">
                        <span id="riskBadge" class="text-[10px] px-2 py-1 rounded font-black uppercase tracking-wider">Analyzing...</span>
                        <p id="aiAdvice" class="text-sm font-semibold text-gray-200"></p>
                    </div>
                    <div id="policeSpot" class="text-xs text-green-400 font-mono bg-black/30 p-2 rounded"></div>
                </div>
            </div>

            <div class="sidebar-card p-5 rounded-2xl shadow-2xl flex flex-col">
                <button id="sosBtn" class="w-full bg-red-600 active:bg-red-800 py-6 rounded-2xl font-black text-4xl border-4 border-white animate-pulse shadow-[0_0_25px_rgba(220,38,38,0.6)] mb-6 transition-transform active:scale-95">
                    SOS
                </button>

                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-4 border-b border-gray-700 pb-2">National Help Directory</h3>
                
                <div class="space-y-3">
                    <a href="tel:112" class="flex items-center justify-between p-3 bg-red-950/40 border border-red-500/30 rounded-xl hover:bg-red-900/50 transition">
                        <div>
                            <p class="font-bold text-red-400 text-sm">112: All-in-One</p>
                            <p class="text-[10px] text-gray-400">Police, Fire, Medical, Women</p>
                        </div>
                        <span class="bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-black">CALL</span>
                    </a>

                    <a href="tel:100" class="flex items-center justify-between p-3 bg-gray-800/50 border border-gray-700 rounded-xl hover:bg-gray-700 transition">
                        <p class="text-sm font-bold">100: Police Dept.</p>
                        <span class="text-blue-400 text-xs font-bold">DIAL</span>
                    </a>

                    <a href="tel:181" class="flex items-center justify-between p-3 bg-purple-900/20 border border-purple-500/30 rounded-xl hover:bg-purple-800/30 transition">
                        <p class="text-sm font-bold text-purple-300">181: Women Helpline</p>
                        <span class="text-purple-400 text-xs font-bold">DIAL</span>
                    </a>

                    <a href="tel:1098" class="flex items-center justify-between p-3 bg-gray-800/50 border border-gray-700 rounded-xl hover:bg-gray-700 transition">
                        <p class="text-sm font-bold">1098: Child Helpline</p>
                        <span class="text-blue-400 text-xs font-bold">DIAL</span>
                    </a>
                </div>

                <p class="mt-auto pt-6 text-[10px] text-gray-500 text-center italic">
                    Emergency numbers are for Indian Territory. <br>Clicking SOS will attempt to send location via SMS.
                </p>
            </div>
        </div>
    </div>

<script>
/* --- CONFIGURATION --- */
const firebaseConfig = {
  apiKey: "AIzaSyBclgRtoVbNlH-PslRwmrA2nEv10XY2w2M",
  authDomain: "hotspot-d2c4d.firebaseapp.com",
  projectId: "hotspot-d2c4d",
  storageBucket: "hotspot-d2c4d.firebasestorage.app",
  messagingSenderId: "679545250194",
  appId: "1:679545250194:web:ceb3181d1487668df1a14b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Initialize Map with Referrer Fix
let map = L.map('map', { zoomControl: false }).setView([20.59, 78.96], 5);
L.control.zoom({ position: 'topright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    referrerPolicy: 'strict-origin-when-cross-origin'
}).addTo(map);

let nearestPolice = "112";

// Check Login Status
auth.onAuthStateChanged(user => { if(!user) window.location.href = 'login.html'; });

/* --- SAFETY CHECK LOGIC --- */
async function checkArea() {
    const loc = document.getElementById('locInput').value;
    const advice = document.getElementById('aiAdvice');
    const policeBox = document.getElementById('policeSpot');
    const statusBox = document.getElementById('statusBox');
    const badge = document.getElementById('riskBadge');

    if(!loc) return;
    statusBox.classList.remove('hidden');
    advice.innerText = "Analyzing safety data...";

    try {
        const geo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${loc}`).then(r => r.json());
        if(geo.length > 0) {
            const { lat, lon } = geo[0];
            map.setView([lat, lon], 14);
            L.marker([lat, lon]).addTo(map).bindPopup("Current Search Area").openPopup();

            // Fetch Police Station within 3km
            const q = `https://overpass-api.de/api/interpreter?data=[out:json];node(around:3000,${lat},${lon})[amenity=police];out;`;
            const res = await fetch(q).then(r => r.json());
            
            if(res.elements && res.elements.length > 0) {
                const station = res.elements[0];
                nearestPolice = (station.tags && station.tags.phone) ? station.tags.phone : "112";
                policeBox.innerHTML = `🚨 Nearest Station: ${station.tags.name || 'Local Police'} | 📞: ${nearestPolice}`;
                advice.innerText = "Law enforcement presence detected nearby. Area analyzed as stable.";
                badge.innerText = "SECURE";
                badge.className = "text-[10px] px-2 py-1 rounded font-black bg-green-900 text-green-200";
                statusBox.style.borderColor = "#10b981";
            } else {
                advice.innerText = "CAUTION: Low density of official police stations in this immediate 3km radius.";
                badge.innerText = "MODERATE RISK";
                badge.className = "text-[10px] px-2 py-1 rounded font-black bg-yellow-900 text-yellow-200";
                statusBox.style.borderColor = "#f59e0b";
            }
        }
    } catch (e) { advice.innerText = "Data fetch error. Check internet."; }
}

/* --- THE SOS SYSTEM --- */
document.getElementById('sosBtn').onclick = () => {
    // 1. Get High-Accuracy Location
    navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
            const user = auth.currentUser;
            if(!user) return alert("Please log in.");

            const snap = await db.collection('users').doc(user.uid).get();
            const u = snap.data();
            
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            
            // Format for easy clicking by emergency responders
            const locUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            const msg = `EMERGENCY! I need immediate help. \nName: ${u.name}\nLocation: ${locUrl}\nSearch Area Police: ${nearestPolice}`;
            
            // JOIN CONTACTS WITH COMMAS (Android Standard)
            const numbers = u.contacts.join(',');
            
            // THE TRIGGER: Opens SMS app with contacts and body pre-filled
            // NOTE: On real phones, this opens the messaging app instantly.
            window.location.href = `sms:${numbers}?body=${encodeURIComponent(msg)}`;

            // Desktop Fallback
            setTimeout(() => {
                alert("SOS Sent! \nIf your SMS app did not open, please manually text your location to: " + numbers);
            }, 1000);

        } catch (error) {
            alert("Error: Missing contact info in your profile.");
        }
    }, (err) => {
        alert("GPS Denied! Turn on Location to send SOS coordinates.");
    }, { enableHighAccuracy: true });
};
</script>
</body>
</html>
