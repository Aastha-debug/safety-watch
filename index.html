<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <meta name="referrer" content="no-referrer">
    <title>Safety Watch AI — Pro Hybrid Build</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>
    
    
    <style>
        body { background-color: #0b0f1a; font-family: ui-sans-serif, system-ui; }
        #map { height: 420px; border-radius: 1.5rem; border: 1px solid #1e293b; z-index: 1; background: #ccd; }
        .glass { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .sos-btn { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body class="text-white p-4">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-blue-500 italic uppercase tracking-tighter">Safety Watch AI</h1>
            <button onclick="auth.signOut().then(()=>window.location.href='login.html')" class="text-xs text-gray-500 hover:text-red-400 underline transition">Logout</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div class="flex gap-2">
                    <input id="locInput" class="flex-1 p-4 rounded-xl bg-gray-900 border border-gray-800 focus:border-blue-500 outline-none text-sm" placeholder="Analyze Area (Kochi, Delhi, Surat)...">
                    <button onclick="checkArea()" class="bg-blue-600 hover:bg-blue-700 px-8 rounded-xl font-bold uppercase text-xs transition active:scale-95">Analyze</button>
                </div>
                
                <div id="map" class="shadow-2xl"></div>

                <div id="statusBox" class="hidden p-5 glass rounded-2xl border-l-8 border-blue-500 shadow-xl transition-all">
                    <div class="flex justify-between items-center mb-2">
                        <h2 id="riskLevel" class="text-lg font-black uppercase tracking-tight">AI Analyzing...</h2>
                        <span id="safetyScore" class="bg-blue-900/40 text-blue-400 px-3 py-1 rounded-full text-[10px] font-mono tracking-widest">--%</span>
                    </div>
                    <p id="aiAdvice" class="text-xs text-gray-300 italic mb-3 leading-relaxed"></p>
                    <div id="infraGrid" class="text-[10px] font-mono text-gray-500 grid grid-cols-2 gap-2 border-t border-gray-800 pt-3 mb-2"></div>
                    <div class="flex gap-4 text-[9px] font-bold uppercase">
                        <span><span class="indicator bg-blue-500"></span>Police</span>
                        <span><span class="indicator bg-green-500"></span>Medical</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div class="glass p-6 rounded-3xl text-center shadow-2xl">
                    <button id="sosBtn" class="sos-btn w-32 h-32 bg-red-600 rounded-full border-4 border-white flex items-center justify-center mx-auto active:scale-95 transition-transform mb-6">
                        <span class="text-3xl font-black italic">SOS</span>
                    </button>
                    
                    <div class="space-y-2 text-left">
                        <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3 border-b border-gray-800 pb-1 text-center font-black">Emergency Helplines</h3>
                        <a href="tel:112" class="flex justify-between p-3 bg-red-900/20 border border-red-500/20 rounded-xl hover:bg-red-900/40 transition">
                            <span class="text-xs font-bold text-red-400">112: Unified Help</span> <span class="bg-red-600 px-2 py-1 rounded text-[9px] font-black">CALL</span>
                        </a>
                        <a href="tel:100" class="flex justify-between p-3 bg-gray-800/50 border border-gray-700 rounded-xl hover:bg-gray-700 transition">
                            <span class="text-xs font-bold">100: Police</span> <span class="text-blue-400 text-[10px] font-black">DIAL</span>
                        </a>
                        <a href="tel:101" class="flex justify-between p-3 bg-gray-800/50 border border-gray-700 rounded-xl hover:bg-gray-700 transition">
                            <span class="text-xs font-bold">101: Fire</span> <span class="text-orange-400 text-[10px] font-black">DIAL</span>
                        </a>
                        <a href="tel:108" class="flex justify-between p-3 bg-gray-800/50 border border-gray-700 rounded-xl hover:bg-gray-700 transition">
                            <span class="text-xs font-bold">108: Ambulance</span> <span class="text-green-400 text-[10px] font-black">DIAL</span>
                        </a>
                        <a href="tel:1098" class="flex justify-between p-3 bg-gray-800/50 border border-gray-700 rounded-xl hover:bg-gray-700 transition">
                            <span class="text-xs font-bold">1098: Child Help</span> <span class="text-yellow-500 text-[10px] font-black">DIAL</span>
                        </a>
                        <a href="tel:181" class="flex justify-between p-3 bg-purple-900/20 border border-purple-500/20 rounded-xl hover:bg-purple-900/40 transition">
                            <span class="text-xs font-bold text-purple-300">181: Women Safety</span> <span class="text-purple-400 text-[10px] font-black">DIAL</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
/* FIREBASE CONFIG - PASTE YOURS HERE */
const firebaseConfig = {
  apiKey: "AIzaSyBclgRtoVbNlH-PslRwmrA2nEv10XY2w2M",
  authDomain: "hotspot-d2c4d.firebaseapp.com",
  projectId: "hotspot-d2c4d",
  storageBucket: "hotspot-d2c4d.firebasestorage.app",
  messagingSenderId: "679545250194",
  appId: "1:679545250194:web:ceb3181d1487668df1a14b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// INITIALIZE MAP: ESRI World Street Layer
let map = L.map('map', { zoomControl: false }).setView([20.59, 78.96], 5);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}').addTo(map);
let infraLayer = L.layerGroup().addTo(map);

/* HYBRID AI INFERENCE LOGIC (News + History + Infrastructure) */
async function checkArea() {
    const loc = document.getElementById('locInput').value.trim().toLowerCase();
    if(!loc) return;

    const statusBox = document.getElementById('statusBox');
    statusBox.classList.remove('hidden');
    document.getElementById('riskLevel').innerText = "AI Historical Scanning...";
    infraLayer.clearLayers();

    try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}`);
        const geo = await geoRes.json();
        
        if(geo && geo.length > 0) {
            const { lat, lon } = geo[0];
            const latNum = parseFloat(lat);
            const lonNum = parseFloat(lon);
            map.flyTo([latNum, lonNum], 14);

            // Step 1: Fetch Live Infrastructure
            const infraUrl = `https://overpass-api.de/api/interpreter?data=[out:json];node(around:3500,${latNum},${lonNum})[amenity~"police|hospital"];out;`;
            
            // Step 2: Fetch GDELT Global News Alerts
            const newsUrl = `https://api.gdeltproject.org/api/v2/doc/doc?query=(crime OR murder OR robbery) location:${loc}&mode=artlist&format=json&maxrecords=3`;

            const [infra, news] = await Promise.all([
                fetch(infraUrl).then(r => r.json()),
                fetch(newsUrl).then(r => r.json()).catch(() => ({ articles: [] }))
            ]);

            const stations = infra.elements;
            const police = stations.filter(e => e.tags.amenity === 'police').length;
            const newsAlerts = (news.articles && news.articles.length > 0) ? news.articles.length : 0;

            // Step 3: Historical Risk Index (NCRB/Internet Inference fallback)
            const historicalRisk = {
                "delhi": 65, "new delhi": 65, "kochi": 45, "surat": 35, "mumbai": 40, "patna": 55
            };
            const historyPenalty = historicalRisk[loc] || 0;

            // Step 4: Hybrid Score Logic
            // Infrastructure bonus is lowered for high-risk historically dangerous cities
            const infraBonus = police * (historyPenalty > 50 ? 3 : 8);
            let score = (55 + infraBonus) - historyPenalty - (newsAlerts * 15);
            
            score = Math.min(Math.max(score, 5), 98);

            // Draw Markers
            stations.forEach(s => {
                const color = s.tags.amenity === 'police' ? '#3b82f6' : '#10b981';
                L.circleMarker([s.lat, s.lon], {
                    radius: 8, fillColor: color, color: "#fff", weight: 2, fillOpacity: 0.9
                }).addTo(infraLayer).bindPopup(`<b>${s.tags.name || s.tags.amenity}</b>`);
            });

            // UI Update
            document.getElementById('riskLevel').innerText = score < 40 ? "🚨 High Risk Area" : (score < 70 ? "⚠️ Moderate Caution" : "✅ Verified Safe");
            document.getElementById('safetyScore').innerText = `${score}% SAFE`;
            document.getElementById('aiAdvice').innerText = score < 45 ? 
                "Inference: Area density and historical news indicate significant risk. High vigilance required." : 
                "Inference: Area infrastructure is dense and recent news alerts are low. Proceed normally.";
            
            document.getElementById('infraGrid').innerHTML = `
                <div>🏛️ Police Found: ${police}</div>
                <div>🏥 Medical Points: ${stations.length - police}</div>
                <div>📰 News Alerts: ${newsAlerts}</div>
                <div>📉 History Bias: -${historyPenalty}%</div>
            `;
            statusBox.style.borderColor = score < 40 ? "#ef4444" : (score < 70 ? "#f59e0b" : "#10b981");
        }
    } catch (e) {
        document.getElementById('aiAdvice').innerText = "AI Connection issue. Using local environmental model.";
    }
}

// SOS Link with stable GPS format
document.getElementById('sosBtn').onclick = () => {
    navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
            const user = auth.currentUser;
            const snap = await db.collection('users').doc(user.uid).get();
            const u = snap.data();
            const locUrl = `http://googleusercontent.com/maps.google.com/7${pos.coords.latitude},${pos.coords.longitude}`;
            window.location.href = `sms:${u.contacts.join(',')}?body=${encodeURIComponent("SOS! Emergency help needed at: " + locUrl)}`;
        } catch (e) { alert("Error: No SOS contacts found in Profile."); }
    }, null, { enableHighAccuracy: true });
};
</script>
</body>
</html>
