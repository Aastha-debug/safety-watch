<!doctype html>
<html>
<head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Login — Safety Watch AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full p-6 bg-gray-800 rounded-xl shadow-lg">
    <h1 class="text-2xl font-bold mb-4 text-center text-blue-500">Welcome Back</h1>
    <input id="email" type="email" placeholder="Email" class="w-full p-3 mb-2 rounded bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <input id="password" type="password" placeholder="Password" class="w-full p-3 mb-4 rounded bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    <button id="loginBtn" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-bold transition">Login to Dashboard</button>
    <p class="mt-4 text-sm text-center text-gray-400">New user? <a href="register.html" class="text-blue-400 underline">Register here</a></p>
    <p id="msg" class="mt-3 text-sm text-center text-red-400"></p>
  </div>

<script>
// USE THE SAME CONFIG AS YOUR OTHER FILES
const firebaseConfig = {
  apiKey: "AIzaSyBclgRtoVbNlH-PslRwmrA2nEv10XY2w2M",
  authDomain: "hotspot-d2c4d.firebaseapp.com",
  projectId: "hotspot-d2c4d",
  storageBucket: "hotspot-d2c4d.firebasestorage.app",
  messagingSenderId: "679545250194",
  appId: "1:679545250194:web:ceb3181d1487668df1a14b",
  measurementId: "G-LJX7RK5PPR"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msgEl = document.getElementById('msg');

  try {
    await auth.signInWithEmailAndPassword(email, password);
    window.location.href = 'index.html';
  } catch (err) {
    msgEl.innerText = err.message;
  }
});
</script>
</body>
</html>
